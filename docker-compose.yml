services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      FILE_UPLOAD_FOLDER: /app/instance/protected_files
      UPLOAD_FOLDER: /app/instance/protected_profiles
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - protected_files:/app/instance/protected_files
      - profile_uploads:/app/instance/protected_profiles

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lodge}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.psql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data:
  protected_files:
  profile_uploads:
