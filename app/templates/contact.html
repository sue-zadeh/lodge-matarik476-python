{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}

{% block content %}
<section class="contact-hero" data-aos="fade-up">
  <div class="container text-center py-5">
    <h1 class="display-5 mb-4">GET IN TOUCH</h1>

    <!-- <p class="mb-2"><i class="fas fa-phone-alt me-2"></i>Phone: 021 000 0000</p>-->
    <p class="mb-2">
      <i class="fas fa-envelope me-2"></i>
      Email: <a href="mailto:{{ config.CONTACT_EMAIL }}">{{ config.CONTACT_EMAIL }}</a>
    </p>
    <p class="mb-4">
      <i class="fas fa-map-marker-alt me-2"></i>
      Address: 45 Neilson Street, Onehunga, Auckland 1061
    </p>

    <form method="post" class="contact-form" id="contactForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="d-none" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="row justify-content-center mt-4" data-aos="fade-up" data-aos-delay="150">
        <div class="col-md-5 mb-3" data-aos="fade-up-right">
          <input class="form-control mb-3" type="text" name="name" maxlength="100" placeholder="Name" required>
          <input class="form-control mb-3" type="email" name="email" maxlength="190" placeholder="Email" required>
          <input class="form-control mb-3" type="text" name="phone" maxlength="20" placeholder="Phone">
        </div>
        <div class="col-md-5 mb-3" data-aos="fade-up-left">
          <textarea
             name="message"
             id="message"
             class="form-control"
             rows="6"
             maxlength="1500"
             required
             placeholder="Your message (maximum 1500 characters)">
           </textarea>

           <small class="text-muted">
             Maximum 1500 characters.
             <span id="messageCount">0 / 1500</span>
           </small>

        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-warning px-4" id="submitBtn" style="min-width: 180px;">
            Submit
          </button>
        </div>
      </div>
    </form>

    <script>
             const messageInput = document.getElementById('message');
             const messageCount = document.getElementById('messageCount');

             messageInput.addEventListener('input', function () {
               messageCount.textContent = `${this.value.length} / 1500`;
             });

             const form = document.getElementById("contactForm");
             const btn = document.getElementById("submitBtn");

             if (form && btn) {
               form.addEventListener("submit", () => {
                 btn.disabled = true;
                 btn.style.opacity = "0.7";
                 btn.innerText = "Sending...";
               });
             }
    </script>
  </div>
</section>
{% endblock %}
