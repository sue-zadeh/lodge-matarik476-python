{% macro password_field(name, label, new_password=false, confirmation=false, error=none, placeholder='') %}
<div class="mb-3">
  <label for="{{ name }}" class="form-label">
    <i class="fas fa-lock" aria-hidden="true"></i> {{ label }}
  </label>
  <div class="password-input position-relative">
    <input type="password"
           class="form-control{% if error %} is-invalid{% endif %}"
           id="{{ name }}"
           name="{{ name }}"
           autocomplete="{{ 'new-password' if new_password or confirmation else 'current-password' }}"
           {% if new_password or confirmation %}minlength="{{ password_min_length }}"{% endif %}
           {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
           {% if new_password or confirmation or error %}aria-describedby="{% if new_password or confirmation %}{{ name }}-help {% endif %}{% if error %}{{ name }}-error{% endif %}"{% endif %}
           {% if error %}aria-invalid="true"{% endif %}
           required>
    <button type="button"
            class="password-toggle"
            onclick="togglePassword('{{ name }}', this)"
            data-password-label="{{ label|lower }}"
            aria-label="Show {{ label|lower }}"
            aria-controls="{{ name }}"
            aria-pressed="false">
      <i class="fas fa-eye" aria-hidden="true"></i>
    </button>
  </div>
  {% if new_password %}
  <p id="{{ name }}-help" class="password-help mt-2 mb-0">{{ password_requirements }}</p>
  {% elif confirmation %}
  <p id="{{ name }}-help" class="password-help mt-2 mb-0">Enter the same password again.</p>
  {% endif %}
  {% if error %}
  <p id="{{ name }}-error" class="password-error mt-2 mb-0" role="alert">{{ error }}</p>
  {% endif %}
</div>
{% endmacro %}
