{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="text-center text-success mt-5 pt-5">
                Forgot Password
            </h1>

            <p class="text-center text-muted">
                Enter the email address registered in your profile.
            </p>

            <form method="POST"
                  action="{{ url_for('forgot_password') }}"
                  autocomplete="off"
                  class="border-success p-4 rounded">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-success w-100">
                    Send Reset Link
                </button>

            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}"
                   class="text-success">
                    Back to Login
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
